[project]
name = "mage-med-ingestion"
version = "0.1.0"
description = "Local-only FHIR R4 validation and canonical normalization for MAGE-Med"
requires-python = ">=3.11"
dependencies = [
  "fhirclient==4.2.0",
  "mage-med-contracts==0.1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mage_med_ingestion"]
