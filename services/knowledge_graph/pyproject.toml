[project]
name = "mage-med-knowledge-graph"
version = "0.1.0"
description = "Bounded multi-tier Neo4j graph for the MAGE-Med monorepo"
requires-python = ">=3.11"
dependencies = [
  "mage-med-contracts==0.1.0",
  "neo4j==6.4.1",
  "pydantic==2.14.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mage_med_knowledge_graph"]
