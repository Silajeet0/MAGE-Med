[project]
name = "mage-med-backend"
version = "0.1.0"
description = "FastAPI application boundary for MAGE-Med"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.165.0",
  "mage-med-contracts==0.1.0",
  "mage-med-ingestion==0.1.0",
  "mage-med-knowledge-graph==0.1.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "python-multipart==0.0.20",
  "sqlalchemy==2.1.9",
  "uvicorn==0.54.0",
]

[project.scripts]
mage-med = "mage_med_backend.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mage_med_backend"]
