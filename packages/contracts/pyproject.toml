[project]
name = "mage-med-contracts"
version = "0.1.0"
description = "Versioned API contracts shared by MAGE-Med components"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mage_med_contracts"]
